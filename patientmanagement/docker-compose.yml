version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: medilabo-postgres
    environment:
      POSTGRES_DB: medilabo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medilabo-network

  patientmanagement:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medilabo-patient-management
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/medilabo
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
    ports:
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - medilabo-network

volumes:
  postgres_data:
    driver: local

networks:
  medilabo-network:
    driver: bridge
