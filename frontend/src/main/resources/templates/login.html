<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - MediLabo</title>
</head>
<style>
    .navbar-brand,
    .nav-link {
        color: white !important;
        font-weight: bold;
    }

    main {
        height: 100vh;
    }

    footer {
        height: auto;
        background-color: rgb(241, 241, 241);
    }
</style>

<body>
    <header class="bg-success">
        <nav class="navbar navbar-expand-sm navbar-light bg-success">
            <div class="container">
                <a class="navbar-brand" href="/">MediLabo</a>
            </div>
        </nav>
    </header>
    <main>
        <div class="container p-5">
            <div class="row justify-content-center">
                <div class="col-md-5">
                    <div class="contentdata mt-2">
                        <h1 class="text text-center text-success mb-4">Login</h1>
                    </div>

                    <div th:if="${error}" class="alert alert-danger" role="alert">
                        Invalid username or password.
                    </div>

                    <div th:if="${logout}" class="alert alert-success" role="alert">
                        You have been logged out.
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control" id="username" name="username"
                                placeholder="Enter username" required autofocus />
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" name="password"
                                placeholder="Enter password" required />
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-success">Sign In</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>
    <footer class="bg-success fixed-bottom">
        <div class="container p-3">
            <div class="row">
                <p class="text-white">Copyright &copy; 2026 MediLabo. All rights reserved.</p>
            </div>
        </div>
    </footer>
</body>

</html>
