<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
  <head>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    .navbar-brand,
    .nav-link {
      color: white !important;
      font-weight: bold;
    }

    main {
      height: 100vh;
    }
    footer {
      height: auto;
      background-color: rgb(241, 241, 241);
    }
  </style>

  <body>
    <header class="bg-success">
      <nav class="navbar navbar-expand-sm navbar-light bg-success">
        <div class="container">
          <a class="navbar-brand" href="/#">MediLabo</a>
          <button
            class="navbar-toggler d-lg-none"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#collapsibleNavId"
            aria-controls="collapsibleNavId"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="collapsibleNavId">
            <ul class="navbar-nav m-auto mt-2 mt-lg-0">
              <li class="nav-item">
                <a class="nav-link active" href="/" aria-current="page"
                  >Home <span class="visually-hidden">(current)</span></a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">Link</a>
              </li>
              <li class="nav-item dropdown">
                <a
                  class="nav-link dropdown-toggle"
                  href="#"
                  id="dropdownId"
                  data-bs-toggle="dropdown"
                  aria-haspopup="true"
                  aria-expanded="false"
                  >Dropdown</a
                >
                <div class="dropdown-menu" aria-labelledby="dropdownId">
                  <a class="dropdown-item" href="#">Action 1</a>
                  <a class="dropdown-item" href="#">Action 2</a>
                </div>
              </li>
            </ul>
          </div>

            <form action="/logout" method="post" class="d-flex ms-auto">
                <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
            </form>
        </div>
      </nav>
    </header>
    <main>
      <div class="container p-5">
        <div class="contentdata mt-2">
          <h1 class="text text-center text-success">Patient Info</h1>
          <br />
        </div>

        <div class="table-responsive">
          <table class="table table-striped align-middle">
            <thead class="table-success">
              <tr>
                <th scope="col">Details</th>
                <th scope="col">First Name</th>
                <th scope="col">Last Name</th>
                <th scope="col">Birthdate</th>
                <th scope="col">Gender</th>
                <th scope="col">Address</th>
                <th scope="col">Phone</th>
                <th scope="col">Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr th:if="${#lists.isEmpty(patientList)}">
                <td colspan="8">No patients found.</td>
              </tr>
              <tr th:each="patient : ${patientList}">
                <td>
                  <a
                    class="btn btn-outline-primary btn-sm"
                    th:href="@{/patientNotes/{id}(id=${patient.id})}"
                    >View</a
                  >
                </td>
                <td th:text="${patient.firstName}"></td>
                <td th:text="${patient.lastName}"></td>
                <td th:text="${patient.dateOfBirth}"></td>
                <td th:text="${patient.gender}"></td>
                <td th:text="${patient.address}"></td>
                <td th:text="${patient.phone}"></td>
                <td class="d-flex gap-2">
                  <a
                    class="btn btn-outline-success btn-sm"
                    th:href="@{/updatePatientForm(id=${patient.id})}"
                    >Update</a
                  >
                  <form
                    th:action="@{/patients/{id}/delete(id=${patient.id})}"
                    method="post"
                    class="m-0"
                  >
                    <button class="btn btn-outline-danger btn-sm" type="submit">
                      Delete
                    </button>
                  </form>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="container p-5">
        <a class="w-20 border btn btn-success" href="/createPatientForm"
          >Add New Patient</a
        >
      </div>
    </main>
    <footer class="bg-success fixed-bottom">
      <div class="container p-3">
        <div class="row">
          <p class="text-white">
            Copyright &copy; 2026 MediLabo. All rights reserved.
          </p>
        </div>
      </div>
    </footer>
  </body>
</html>
