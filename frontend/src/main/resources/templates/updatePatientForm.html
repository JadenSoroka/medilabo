<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
  <head>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    .navbar-brand,
    .nav-link {
      color: white !important;
      font-weight: bold;
    }

    main {
      height: 100vh;
    }
    footer {
      height: auto;
      background-color: rgb(241, 241, 241);
    }
  </style>

  <body>
    <header class="bg-success">
      <nav class="navbar navbar-expand-sm navbar-light bg-success">
        <div class="container">
          <a class="navbar-brand" href="/#">MediLabo</a>
          <button
            class="navbar-toggler d-lg-none"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#collapsibleNavId"
            aria-controls="collapsibleNavId"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="collapsibleNavId">
            <ul class="navbar-nav m-auto mt-2 mt-lg-0">
              <li class="nav-item">
                <a class="nav-link active" href="/" aria-current="page"
                  >Home <span class="visually-hidden">(current)</span></a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">Link</a>
              </li>
              <li class="nav-item dropdown">
                <a
                  class="nav-link dropdown-toggle"
                  href="#"
                  id="dropdownId"
                  data-bs-toggle="dropdown"
                  aria-haspopup="true"
                  aria-expanded="false"
                  >Dropdown</a
                >
                <div class="dropdown-menu" aria-labelledby="dropdownId">
                  <a class="dropdown-item" href="#">Action 1</a>
                  <a class="dropdown-item" href="#">Action 2</a>
                </div>
              </li>
            </ul>
          </div>

            <form action="/logout" method="post" class="d-flex ms-auto">
                <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
            </form>
        </div>
      </nav>
    </header>
    <main>
      <div class="container p-5">
        <div class="contentdata mt-2">
          <h1 class="text text-center text-success">Patient Form</h1>
          <h3 class="text text-center text-success">
            Enter patient information
          </h3>
          <br />
        </div>

        <form
          action="#"
          th:action="@{/patients/{id}(id=${patient.id})}"
          th:object="${patient}"
          method="post"
          class="w-25"
        >
          <input type="hidden" name="_method" value="put" />
          <div class="mb-3">
            <p class="mb-0">First Name:</p>
            <input
              name="firstName"
              type="text"
              class="form-control"
              placeholder="Enter patient first name"
              readonly
              th:field="*{firstName}"
            />
          </div>
          <div class="mb-3">
            <p class="mb-0">Last Name:</p>
            <input
              name="lastName"
              type="text"
              class="form-control"
              placeholder="Enter patient last name"
              readonly
              th:field="*{lastName}"
            />
          </div>
          <div class="mb-3">
            <p class="mb-0">Date of Birth:</p>
            <input
              name="dateOfBirth"
              type="text"
              class="w-120"
              placeholder="MM/DD/YYYY"
              th:field="*{dateOfBirth}"
            />
          </div>
          <div class="mb-3">
            <p class="mb-0">Gender:</p>
            <input
              name="gender"
              type="radio"
              class="w-120"
              value="M"
              id="M"
              th:field="*{gender}"
            />
            <label for="M">Male</label>
            <input
              name="gender"
              type="radio"
              class="w-120"
              value="F"
              id="F"
              th:field="*{gender}"
            />
            <label for="F">Female</label>
            <input
              name="gender"
              type="radio"
              class="w-120"
              value="O"
              id="O"
              th:field="*{gender}"
            />
            <label for="O">Other</label>
          </div>
          <div class="mb-3">
            <p class="mb-0">Address:</p>
            <input
              name="address"
              type="text"
              class="w-120"
              placeholder="Enter patient address"
              th:field="*{address}"
            />
          </div>
          <div class="mb-3">
            <p class="mb-0">Phone:</p>
            <input
              name="phone"
              type="text"
              class="w-120"
              placeholder="1234567890"
              th:field="*{phone}"
            />
          </div>

          <br />
          <button class="btn btn-success" type="submit">Update</button>
        </form>
      </div>
    </main>
    <footer class="bg-success fixed-bottom">
      <div class="container p-3">
        <div class="row">
          <p class="text-white">
            Copyright &copy; 2026 MediLabo. All rights reserved.
          </p>
        </div>
      </div>
    </footer>
  </body>
</html>
