<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
  <head>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Patient Notes</title>
  </head>
  <style>
    .navbar-brand,
    .nav-link {
      color: white !important;
      font-weight: bold;
    }

    main {
      min-height: 100vh;
      padding-bottom: 120px;
    }

    footer {
      height: auto;
      background-color: rgb(241, 241, 241);
    }

    .actions-col {
      width: 1%;
      white-space: nowrap;
      text-align: right;
    }

    .actions-buttons {
      display: inline-flex;
      gap: 0.5rem;
      justify-content: flex-end;
    }

    .note-content {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-family: monospace;
      tab-size: 4;
    }
  </style>

  <body>
    <header class="bg-success">
      <nav class="navbar navbar-expand-sm navbar-light bg-success">
        <div class="container">
          <a class="navbar-brand" href="/#">MediLabo</a>
          <button
            class="navbar-toggler d-lg-none"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#collapsibleNavId"
            aria-controls="collapsibleNavId"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="collapsibleNavId">
            <ul class="navbar-nav m-auto mt-2 mt-lg-0">
              <li class="nav-item">
                <a class="nav-link active" href="/" aria-current="page"
                  >Home <span class="visually-hidden">(current)</span></a
                >
              </li>
            </ul>
          </div>

            <form action="/logout" method="post" class="d-flex ms-auto">
                <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
            </form>
        </div>
      </nav>
    </header>

    <main>
      <div class="container p-5">
        <div class="contentdata mt-2">
          <h2 class="text text-center text-success">Patient Notes</h2>
          <br />
        </div>

        <div>
          <p>Diabetes Risk: <span th:text="${diabetesRisk.expectedRisks}"></span></p>
        </div>

        <div class="table-responsive">
          <table class="table table-striped align-middle">
            <thead class="table-success">
              <tr>
                <th scope="col">Notes</th>
                <th scope="col" class="actions-col">Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr th:if="${#lists.isEmpty(notes)}">
                <td colspan="2">No notes found for this patient.</td>
              </tr>
              <tr th:each="note : ${notes}">
                <td class="note-content" th:text="${note.note}"></td>
                <td class="actions-col">
                  <div class="actions-buttons">
                    <a
                      class="btn btn-outline-success btn-sm"
                      th:href="@{/updateNoteForm(noteId=${note.noteId}, patId=${patId})}"
                      >Update</a
                    >
                    <form
                      th:action="@{/notes/{noteId}/delete(noteId=${note.noteId})}"
                      method="post"
                      class="m-0"
                    >
                      <input type="hidden" name="patId" th:value="${patId}" />
                      <button
                        class="btn btn-outline-danger btn-sm"
                        type="submit"
                      >
                        Delete
                      </button>
                    </form>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="mt-4 d-flex gap-2">
          <a class="w-20 border btn btn-success" href="/patient"
            >Back To Patients</a
          >
          <a
            class="w-20 border btn btn-success"
            th:href="@{/createNoteForm(patId=${patId})}"
            >Create Note</a
          >
        </div>
      </div>
    </main>

    <footer class="bg-success fixed-bottom">
      <div class="container p-3">
        <div class="row">
          <p class="text-white">
            Copyright &copy; 2026 MediLabo. All rights reserved.
          </p>
        </div>
      </div>
    </footer>
  </body>
</html>
