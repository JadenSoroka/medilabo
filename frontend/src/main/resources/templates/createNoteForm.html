<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
  <head>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Note</title>
  </head>
  <style>
    .navbar-brand,
    .nav-link {
      color: white !important;
      font-weight: bold;
    }

    main {
      height: 100vh;
    }
    footer {
      height: auto;
      background-color: rgb(241, 241, 241);
    }
  </style>

  <body>
    <header class="bg-success">
      <nav class="navbar navbar-expand-sm navbar-light bg-success">
        <div class="container">
          <a class="navbar-brand" href="/#">MediLabo</a>
          <button
            class="navbar-toggler d-lg-none"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#collapsibleNavId"
            aria-controls="collapsibleNavId"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="collapsibleNavId">
            <ul class="navbar-nav m-auto mt-2 mt-lg-0">
              <li class="nav-item">
                <a class="nav-link active" href="/" aria-current="page"
                  >Home <span class="visually-hidden">(current)</span></a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="/patient">Patients</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>
    <main>
      <div class="container p-5">
        <div class="contentdata mt-2">
          <h1 class="text text-center text-success">Note Form</h1>
          <h3 class="text text-center text-success">Enter note information</h3>
          <br />
        </div>

        <form
          action="#"
          th:action="@{/notes}"
          th:object="${note}"
          method="post"
          class="w-25 mx-auto"
        >
          <input type="hidden" th:field="*{patId}" />
          <div class="mb-3">
            <p class="mb-0">Patient:</p>
            <input
              name="patient"
              type="text"
              class="form-control"
              placeholder="Enter patient name"
              readonly
              th:field="*{patient}"
            />
          </div>
          <div class="mb-3">
            <p class="mb-0">Note:</p>
            <textarea
              name="note"
              class="w-120"
              rows="5"
              placeholder="Enter note content"
              th:field="*{note}"
            ></textarea>
          </div>

          <br />
          <button class="btn btn-success" type="submit">Submit</button>
        </form>
      </div>
    </main>
    <footer class="bg-success fixed-bottom">
      <div class="container p-3">
        <div class="row">
          <p class="text-white">
            Copyright &copy; 2026 MediLabo. All rights reserved.
          </p>
        </div>
      </div>
    </footer>
  </body>
</html>
