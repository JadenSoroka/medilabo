services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: diabetesassessment:latest
    container_name: diabetesassessment-app
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_started
    ports:
      - "9092:9092"
    environment:
      SERVER_PORT: 9092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/medilabo
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_MONGODB_URI: mongodb://mongodb:27017/medilabo
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: diabetesassessment-postgres
    environment:
      POSTGRES_DB: medilabo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medilabo"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: diabetesassessment-mongodb
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    restart: unless-stopped

volumes:
  postgres_data:
  mongodb_data:
